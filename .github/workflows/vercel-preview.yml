name: Vercel Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  routing-tests:
    name: routing-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Routing unit tests
        run: npm test -- src/lib/routing/unknown-path.test.mjs
        env:
          NODE_OPTIONS: --experimental-strip-types

  deploy-preview:
    name: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public IDs from the Vercel GitHub integration comment on this repo.
      VERCEL_ORG_ID: team_t2EfFaQKKvvdpdB4GIb1Ev6T
      VERCEL_PROJECT_ID: prj_xbiHoDVIQSwekCokZmz4l6Pj746n
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Require VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set. The Vercel Git integration fails instantly on Cursor GitHub App pushes, so this workflow needs a Vercel token to publish a preview URL."
            exit 1
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel preview env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token="$VERCEL_TOKEN"
      - name: Deploy preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"
