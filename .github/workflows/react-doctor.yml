name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    name: react-doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      # millionco/react-doctor@v2 is blocked by this repo's Actions allowlist
      # (GitHub-created actions only, pinned to a full commit SHA). The CLI is
      # the same scanner the Action wraps; advisory mode matches the docs default.
      - name: Scan React code
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            npx --yes react-doctor@latest --yes --blocking none --scope changed --base "${BASE_SHA}"
          else
            npx --yes react-doctor@latest --yes --blocking none --scope full
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
